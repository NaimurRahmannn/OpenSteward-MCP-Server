services:
  opensteward:
    image: opensteward:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      OPENSTEWARD_HOST: 0.0.0.0
      OPENSTEWARD_PORT: "8000"
      OPENSTEWARD_GITHUB_PRIVATE_KEY_PATH: /run/secrets/opensteward-github-app.pem
      OPENSTEWARD_EMBEDDING_CACHE_DIR: /tmp/opensteward-fastembed
    ports:
      - "8000:8000"
    volumes:
      - type: bind
        source: ${OPENSTEWARD_GITHUB_PRIVATE_KEY_HOST_PATH:?Set OPENSTEWARD_GITHUB_PRIVATE_KEY_HOST_PATH to the host GitHub App private-key file}
        target: /run/secrets/opensteward-github-app.pem
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
